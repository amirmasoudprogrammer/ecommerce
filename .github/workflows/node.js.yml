
name: Next.js CI

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Get project code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Check code quality
      - name: Run ESLint
        run: npm run lint

      # Build Next.js project
      - name: Build project
        run: npm run build
